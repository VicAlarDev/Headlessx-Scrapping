version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: headlessx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-headlessx}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-headlessx_secret}
      POSTGRES_DB: ${POSTGRES_DB:-headlessx}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-headlessx} -d ${POSTGRES_DB:-headlessx}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - headlessx-network

  # Redis for caching and job queues
  redis:
    image: redis:7-alpine
    container_name: headlessx-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-headlessx_redis}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-headlessx_redis}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - headlessx-network

  # pgAdmin for database management (optional, for development)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: headlessx-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:valfonsob98@gmail.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - headlessx-network
    profiles:
      - dev

  # HeadlessX Application (optional - can run separately)
  # app:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: headlessx-app
  #   restart: unless-stopped
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=postgresql://${POSTGRES_USER:-headlessx}:${POSTGRES_PASSWORD:-headlessx_secret}@postgres:5432/${POSTGRES_DB:-headlessx}
  #     - REDIS_URL=redis://:${REDIS_PASSWORD:-headlessx_redis}@redis:6379
  #   ports:
  #     - "${APP_PORT:-3000}:3000"
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy
  #   networks:
  #     - headlessx-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  headlessx-network:
    driver: bridge
